# MP187 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G046"          # your group id, e.g. "G042"
problem_id: "MP187"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: delay_logged_by_conductor           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: driver_exp_yr           # the column recorded in a different unit
    group_value: North      # the value of depot_zone whose rows are affected
    factor: 12           # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: true
    count: 57            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 8            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "MP187 City Bus Delay"
  best_run_id: "753f1def73ca4c9fbb057b2a72e69634"
  registered_model_name: "mp187-city-bus-delay"
  champion_version: 1

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    route_km: null
    stops: null
    passengers: null
    hour: null
    temp_c: null
    driver_exp_yr: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of depot_zone
    'North': null
    'South': null
    'East': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
