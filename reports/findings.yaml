  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: delay_logged_by_conductor           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: driver_exp_yr           # the column recorded in a different unit
    group_value: North      # the value of depot_zone whose rows are affected
    factor: 12           # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: true
    count: 57            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 8            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

