apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp187-api
  labels:
    app: mp187-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp187-api
  template:
    metadata:
      labels:
        app: mp187-api
    spec:
      containers:
        - name: mp187-api
          image: mp187-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
